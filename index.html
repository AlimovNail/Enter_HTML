<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Форма авторизации</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <form action="">
      <div class="header-box">
        <h1>SuaLogo</h1>
        <img src="./media/hestek.png" alt="logo"   width="55"
          height="55" /> 
      </div>

      <div class="input-box">
        <input type="text" name="name" placeholder="Пользователь" required />
        <img  src="./media/avatar.png"  alt="иконка"  width="15"  height="15"
        />
      </div>
      <div class="input-box">
        <input type="password" name="password" placeholder="Пароль" required />
        <img src="./media/password.png" alt="иконка" width="15" height="15" />
      </div>
      <button class="submit-btn" type="submit">Войти</button>
    </form>
  </body>
</html>
